name: Build & Publish Porkchop Hosyond 4.0

on:
  push:
    branches: [hosyond-cyd40, hosyond-cyd40-render-test]
  workflow_dispatch:

permissions:
  contents: write

# Only the newest commit may publish the mutable preview/test release.
# Concurrent runs otherwise race and can replace the new BIN with an old BIN.
concurrency:
  group: hosyond-cyd40-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and dependencies
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.7 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli lib install "TFT_eSPI"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "XPT2046_Touchscreen"
          arduino-cli lib install "TinyGPSPlus"
          python -m pip install "esptool>=4,<5"
      - name: Configure Hosyond ST7796S
        run: |
          cp Hosyond_User_Setup.h ~/Arduino/libraries/TFT_eSPI/User_Setup.h
      - name: Compile Hosyond 4.0 firmware
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=custom,FlashMode=dio,FlashFreq=80,FlashSize=4M \
            --build-property "build.extra_flags=-DHOSYOND_CYD40=1 -DPORKCHOP_FW_BUILD=${GITHUB_RUN_NUMBER}" \
            --output-dir ./build \
            ./PorkChop_CYD
      - name: Assemble browser and Launcher images
        run: |
          set -eu
          mkdir -p site/firmware site/flash
          # Three internal flash parts are only for ESP Web Tools.
          cp build/PorkChop_CYD.ino.bootloader.bin site/flash/bootloader.bin
          cp build/PorkChop_CYD.ino.partitions.bin site/flash/partitions.bin
          cp build/PorkChop_CYD.ino.bin site/flash/firmware.bin
          # Two 0x1B0000-byte slots allow safe OTA; reject future oversize builds.
          test "$(stat -c %s site/flash/firmware.bin)" -le $((0x1B0000))
          python - <<'PY'
          import os, hashlib, json
          from pathlib import Path
          firmware = Path("site/flash/firmware.bin")
          manifest = {
              "build": int(os.environ["GITHUB_RUN_NUMBER"]),
              "version": "preview.r" + os.environ["GITHUB_RUN_NUMBER"],
              "firmware": "https://mjwgeek.github.io/Porkchop-cyd-Port/flash/firmware.bin",
              "bytes": firmware.stat().st_size,
              "sha256": hashlib.sha256(firmware.read_bytes()).hexdigest(),
          }
          Path("site/ota.json").write_text(
              json.dumps(manifest, separators=(",", ":")) + "\n", encoding="utf-8")
          print("Porkchop fork OTA: ", manifest)
          PY
          cp build/PorkChop_CYD.ino.bin site/firmware/Porkchop-Hosyond-4.0-Launcher.bin
          python -m esptool --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            -o site/firmware/Porkchop-Hosyond-4.0-Full.bin \
            0x1000 site/flash/bootloader.bin \
            0x8000 site/flash/partitions.bin \
            0x10000 site/flash/firmware.bin
          cp web/index.html site/index.html
          cp web/manifest.json site/manifest.json
          test -s site/flash/firmware.bin
          test -s site/firmware/Porkchop-Hosyond-4.0-Launcher.bin
          test -s site/firmware/Porkchop-Hosyond-4.0-Full.bin
      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: Porkchop-Hosyond-4.0-Firmware
          path: |
            site/firmware/Porkchop-Hosyond-4.0-Launcher.bin
            site/firmware/Porkchop-Hosyond-4.0-Full.bin
            site/ota.json
            site/flash/firmware.bin
          if-no-files-found: error
      - name: Publish isolated Hosyond DISPLAY + OTA test binaries
        if: github.ref == 'refs/heads/hosyond-cyd40-render-test'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="hosyond-cyd40-display-ota-test"
          APP="site/firmware/Porkchop-Hosyond-4.0-Launcher.bin"
          FULL="site/firmware/Porkchop-Hosyond-4.0-Full.bin"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APP" "$FULL" --clobber
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create "$TAG" "$APP" "$FULL" \
              --target "$GITHUB_SHA" --prerelease \
              --title "EXPERIMENTAL: Porkchop Hosyond display + OTA" \
              --notes "Hardware validation pending. TEST branch only; live preview unchanged. Launcher is app-only; Full modifies bootloader/partitions and may erase settings or captures. No OTA update feed is deployed from this branch."
          fi
      - name: Publish Hosyond firmware to Releases
        if: github.ref == 'refs/heads/hosyond-cyd40'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="hosyond-cyd40-preview"
          APP="site/firmware/Porkchop-Hosyond-4.0-Launcher.bin"
          FULL="site/firmware/Porkchop-Hosyond-4.0-Full.bin"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APP" "$FULL" --clobber
            # This tag is explicitly a rolling, mutable PREVIEW tag.
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f sha="$GITHUB_SHA" -F force=true
          else
            gh release create "$TAG" "$APP" "$FULL" \
              --target "$GITHUB_SHA" \
              --title "Porkchop · Hosyond 4.0 preview" \
              --notes "Compiled Hosyond 4.0 ST7796S firmware (hardware testing pending). Launcher.bin is an app-only image requiring a compatible existing app partition; Full.bin is a merged image to flash at offset 0x0. The preview tag and its two assets are updated after successful builds." \
              --prerelease
          fi
      - name: Publish the website to gh-pages
        if: github.ref == 'refs/heads/hosyond-cyd40'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
